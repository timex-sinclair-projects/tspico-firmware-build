<!doctype html><html><head><meta charset="utf-8"><title>mask</title>
<!-- Laid over each chapter's opener page (a right-hand page) by book.py: paints
     out the running head and the red keywords at the inner foot, and leaves
     the page number. The rest of the page stays transparent. -->
<style>
@page { size: 5.5in 8.5in; margin: 0; }
html, body { margin: 0; }
div { position: absolute; background: #fff; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
</style></head>
<body>
  <div style="left: 0; top: 0; width: 5.5in; height: 0.8in"></div>
  <div style="left: 0; bottom: 0; width: 3.4in; height: 0.68in"></div>
</body></html>
