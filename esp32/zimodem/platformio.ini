; Zimodem for the TS-Pico v3's ESP32-C3-WROOM-02 (U40, 4 MB flash).
; build.sh fetches the Zimodem source into Zimodem/ and runs `pio run`.

[platformio]
src_dir = Zimodem/zimodem

[env:tspico_c3]
; 6.9.0 ships Arduino-ESP32 2.0.17, the core Zimodem's README names.
platform = espressif32@6.9.0
board = esp32-c3-devkitm-1
framework = arduino
; Two 1.9 MB app slots (Zimodem updates itself over the air) and SPIFFS for
; its configuration and phonebook.
board_build.partitions = min_spiffs.csv
build_flags =
	-DARDUINO_ESP32C3_DEV
	; UART0 (IO20/IO21) is the modem port; the module's USB pins are not wired.
	-DARDUINO_USB_CDC_ON_BOOT=0
	; No ESP32 core log lines on UART0: it is the 2068's line, and in a call a
	; log line would reach the 2068 as text (Zimodem's first AT&W printed an
	; "[E] ... remove()" line on proto1, 2026-10-12).
	-DCORE_DEBUG_LEVEL=0
; Through the card's USB port: the web updater's modem step, or
; tspico-hardware's firmware/bringup esp_bridge.uf2 for `build.sh upload`.
upload_speed = 460800
monitor_speed = 1200
