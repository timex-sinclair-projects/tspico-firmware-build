name: Deploy site to GitHub Pages

# Builds the combined ts-pico site and publishes it to GitHub Pages:
#
#   /                  ← the Jekyll site (migrated from ts-pico.com, source in site/)
#   /updater/          ← the Web Updater (web-updater/)
#   /updater/release/  ← payload from the latest GitHub Release
#   /updater/main/     ← payload from the latest green build of main (testers)
#
# A payload is manifest.json, pico/ (the files written over serial),
# firmware.uf2, upgrade.uf2 (the 1.1/1.5 ROM updater) and the zips. The page
# fetches them from its own same-origin path — that's why we mount them into
# the built site here rather than linking to release assets or CI artifacts
# (GitHub's release CDN blocks cross-origin browser fetches, and artifacts need
# a token; see web-updater/README.md).
#
# Triggers:
#   - push to main touching site/, web-updater/, or "SD card/" (content edits)
#   - a published Release (refreshes the updater payload with the new firmware,
#     built by release.yml)
#   - a green build of main (refreshes the main/ channel)
#   - manual dispatch
#
# ── One-time repo setup ────────────────────────────────────────────────
# Settings → Pages → Source → "GitHub Actions". (Replaces the old
# "Deploy from a branch / gh-pages" setup that release.yml used.)
#
# ── Going live on ts-pico.com ──────────────────────────────────────────
# 1. In site/_config.yml set `baseurl: ""`.
# 2. Add a CNAME step (or commit site/CNAME containing "ts-pico.com").
# 3. Settings → Pages → Custom domain → ts-pico.com, and point DNS at GitHub.

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'web-updater/**'
      - 'SD card/**'
      - '.github/workflows/pages.yml'
  release:
    types: [published]
  workflow_dispatch:
  # Auto-publish the updater after a release build finishes. We chain off the
  # Release workflow COMPLETING (workflow_run) rather than the `release:
  # published` event: a Release created with the built-in GITHUB_TOKEN does NOT
  # fire `release` for downstream workflows (GitHub's recursion guard), but
  # workflow_run is not subject to that, so this actually runs.
  #
  # Same for main's build, so the testers' main/ channel follows main. (Not a
  # `branches:` filter here: it would apply to the Release run too, whose
  # head_branch is its tag. The job's `if` filters instead.)
  workflow_run:
    workflows: ["Release TS-Pico Firmware", "Build TS-Pico Firmware"]
    types: [completed]

permissions:
  contents: read
  actions: read       # gh run download: the main/ channel's CI artifacts
  pages: write
  id-token: write

# Allow one concurrent deploy; don't cancel an in-progress one (a release and a
# push can race).
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-22.04
    # When chained off a workflow, only publish if it passed -- and for the
    # firmware build, only for pushes to main (not branches or PRs).
    if: >-
      ${{ github.event_name != 'workflow_run' ||
          (github.event.workflow_run.conclusion == 'success' &&
           (github.event.workflow_run.name == 'Release TS-Pico Firmware' ||
            (github.event.workflow_run.head_branch == 'main' &&
             github.event.workflow_run.event == 'push'))) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0    # the main/ channel archives src/ at its build's commit

      # Compile the tracked BASIC sources (basic/*.bas) into TAPs before the
      # SD-card payload is assembled. Outputs land in "SD card/TAP/basic/"
      # (gitignored) and get zipped into sdcard.zip by build-payload.sh below.
      # gcc/make are preinstalled on the ubuntu runner.
      - name: Build BASIC programs (basic/ -> TAP)
        run: ./tools/build-basic.sh

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
          working-directory: site

      - name: Build Jekyll site
        working-directory: site
        env:
          JEKYLL_ENV: production
        run: bundle exec jekyll build --trace
        # Outputs to site/_site

      # ── release/ channel: the latest published GitHub Release ──────────
      - name: Fetch the latest release's UF2s
        id: rel
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p _rel
          TAG=""
          if [ "${{ github.event_name }}" = "release" ]; then
            TAG="${{ github.event.release.tag_name }}"
          else
            TAG="$(gh release view --json tagName --jq .tagName 2>/dev/null || echo '')"
          fi
          # Tolerate "no releases yet" and releases from before upgrade.uf2
          # existed: the page shows what's missing and offers the main/ channel.
          if [ -n "$TAG" ]; then
            gh release download "$TAG" --pattern 'firmware.uf2' --dir _rel || true
            gh release download "$TAG" --pattern 'upgrade.uf2'  --dir _rel || true
          fi
          echo "tag=${TAG:-dev}" >> "$GITHUB_OUTPUT"
          ls -la _rel

      - name: Build the release/ channel
        env:
          CHANNEL: release
          OUT_DIR: ${{ github.workspace }}/_payload/release
          UPGRADE_UF2: ${{ github.workspace }}/_rel/upgrade.uf2
          SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ steps.rel.outputs.tag }}
        run: |
          # The Pico files come from the release's own commit when there is
          # one, so they match its firmware.
          SRC="$PWD/src"
          if git rev-parse -q --verify "refs/tags/${{ steps.rel.outputs.tag }}" >/dev/null; then
            mkdir -p _rel/tree
            git archive "${{ steps.rel.outputs.tag }}" src basic tools 2>/dev/null | tar -x -C _rel/tree \
              || git archive "${{ steps.rel.outputs.tag }}" src | tar -x -C _rel/tree
            # nofile/romupdate/dckupdate.tap are generated (gitignored), so an
            # archive of src/ alone ships only the committed rompatch.tap. Build
            # them from the same commit. Tags from before build-basic.sh (#34)
            # still committed their TAPs, so there is nothing to build.
            if [ -x _rel/tree/tools/build-basic.sh ]; then
              ./_rel/tree/tools/build-basic.sh
            fi
            SRC="$PWD/_rel/tree/src"
          fi
          SDCARD_DIR="$PWD/SD card" bash web-updater/build-payload.sh "$SRC" "${{ steps.rel.outputs.tag }}" "$PWD/_rel/firmware.uf2"

      # ── main/ channel: the latest green build of main, for testers ─────
      # CI artifacts need a token to download, so the browser can't fetch
      # them; we fetch them here and publish them same-origin like the rest.
      - name: Fetch the latest green main build's UF2s
        id: main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Don't filter with --status success: while other main builds are
          # in flight it has returned a months-old run (Pages run
          # 36475123993). List recent runs, keep the green ones client-side,
          # newest first, and take the first whose firmware still downloads.
          CANDIDATES="$(gh run list --workflow build.yml --branch main --event push \
                          --limit 20 --json databaseId,headSha,conclusion,createdAt \
                          --jq 'map(select(.conclusion == "success")) | sort_by(.createdAt) | reverse
                                | .[] | "\(.databaseId) \(.headSha)"')"
          ID= SHA=
          while read -r CID CSHA; do
            [ -n "$CID" ] || continue
            HAVE="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CID/artifacts" \
                      --jq '[.artifacts[] | select(.name == "tspico-firmware-uf2" and (.expired | not))] | length')" || HAVE=
            if [ "$HAVE" != "1" ]; then
              echo "Run $CID ($CSHA): no unexpired tspico-firmware-uf2 artifact, trying the next."
              continue
            fi
            rm -rf _main && mkdir -p _main/fw _main/upg
            if ! gh run download "$CID" -n tspico-firmware-uf2 -D _main/fw; then
              echo "Run $CID ($CSHA): firmware download failed, trying the next."
              continue
            fi
            ID=$CID SHA=$CSHA
            break
          done <<< "$CANDIDATES"
          if [ -z "$ID" ]; then
            echo "No green build of main with a downloadable firmware -- no main/ channel."
            echo "run=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          gh run download "$ID" -n tspico-upgrade-uf2  -D _main/upg || true
          # The upgrade artifact nests its UF2 under its build path.
          UPG="$(find _main/upg -path '*build-UPGRADE/firmware.uf2' | head -1)"
          echo "run=$ID" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "upg=${UPG:+$PWD/$UPG}" >> "$GITHUB_OUTPUT"
          echo "main/ channel: run $ID at $SHA"

      - name: Build the main/ channel
        if: steps.main.outputs.run != ''
        env:
          CHANNEL: main
          OUT_DIR: ${{ github.workspace }}/_payload/main
          UPGRADE_UF2: ${{ steps.main.outputs.upg }}
          SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ steps.main.outputs.run }}
        run: |
          SHA="${{ steps.main.outputs.sha }}"
          mkdir -p _main/tree
          git archive "$SHA" src basic tools | tar -x -C _main/tree
          # Build the generated TAPs (nofile/romupdate/dckupdate) for this
          # commit -- they are gitignored, so the archive doesn't have them.
          ./_main/tree/tools/build-basic.sh
          SDCARD_DIR="$PWD/SD card" bash web-updater/build-payload.sh \
            "$PWD/_main/tree/src" "main@${SHA:0:7}" "$PWD/_main/fw/firmware.uf2"

      - name: Mount Web Updater at /updater/
        run: |
          DEST=site/_site/updater
          mkdir -p "$DEST"
          cp web-updater/index.html web-updater/app.js web-updater/flasher.js "$DEST"/
          cp web-updater/flash_nuke.uf2 "$DEST"/flash_nuke.uf2
          cp -r web-updater/vendor "$DEST"/vendor
          cp -r _payload/.        "$DEST"/
          touch site/_site/.nojekyll
          echo "=== published updater tree ==="
          find "$DEST" -maxdepth 2 | sort

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/_site

  deploy:
    needs: build
    runs-on: ubuntu-22.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
