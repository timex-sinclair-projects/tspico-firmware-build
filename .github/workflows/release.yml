name: Release TS-Pico Firmware

# Fires on a git tag matching v*. To cut a release:
#
#   git tag v1.0.0
#   git push --tags
#
# The workflow builds firmware.uf2 + dev_tspico.mpy fresh from the
# tagged commit, bundles them with all the Pico-flash content from
# the repo (main.py, config.ini, assets/, help/, words.txt, plus the
# dev override convenience files), zips the bundle, and creates a
# GitHub Release with auto-generated notes (from commit messages
# since the previous tag).
#
# Publishing the website + Web Updater to GitHub Pages is done by a
# separate workflow (.github/workflows/pages.yml), which is triggered when
# this job creates the Release. See the note near the end of this file.
#
# Manual dispatch is also supported for testing: run the workflow
# from the Actions tab with workflow_dispatch and supply a tag.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v1.0.0). Must already exist.'
        required: true
        type: string

jobs:
  release:
    runs-on: ubuntu-22.04

    permissions:
      # Required so `gh release create` can publish the release and
      # upload assets. Default GITHUB_TOKEN only has read perms.
      contents: write

    steps:
      - name: Determine tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Releasing tag: ${TAG}"

      - name: Checkout repo at tag
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.tag }}
          fetch-depth: 0  # full history for release-notes generation

      # apt on the hosted runners sometimes hangs mid-download (four times
      # on 2026-09-30); a normal install takes about a minute. Each attempt
      # gets 4 minutes and a stuck one is retried, so a bad mirror costs
      # minutes instead of blocking the job until GitHub's own limit.
      - name: Install build tools
        timeout-minutes: 15
        run: |
          for attempt in 1 2 3; do
            if sudo timeout 240 apt-get update \
               && sudo timeout 240 apt-get install -y \
                    -o Acquire::Retries=3 -o Acquire::http::Timeout=30 \
                    git build-essential cmake \
                    gcc-arm-none-eabi libnewlib-arm-none-eabi \
                    python3 zip; then
              exit 0
            fi
            echo "::warning::apt attempt $attempt failed or timed out; retrying"
            sudo dpkg --configure -a || true   # finish anything a killed install left half-done
            sleep 10
          done
          echo "::error::apt failed three times"
          exit 1

      - name: Clone MicroPython v1.20.0
        run: |
          git clone --depth 1 --branch v1.20.0 \
            https://github.com/micropython/micropython.git ${{ github.workspace }}/micropython

      # ──────────────────────────────────────────────────────────────────
      # The next steps mirror .github/workflows/build.yml. If you
      # change either workflow, update both. (Extracting to a composite
      # action is the cleaner option but adds an indirection we don't
      # need yet — two callers.)
      # ──────────────────────────────────────────────────────────────────
      - name: Stage frozen modules
        run: |
          mkdir -p ${{ github.workspace }}/micropython/ports/rp2/modules/TS
          cp src/TS/__init__.py      ${{ github.workspace }}/micropython/ports/rp2/modules/TS/__init__.py
          cp src/TS/tspico.py        ${{ github.workspace }}/micropython/ports/rp2/modules/TS/tspico.py
          cp src/TS/tspico_io.py     ${{ github.workspace }}/micropython/ports/rp2/modules/TS/tspico_io.py
          cp src/TS/sdcard.py        ${{ github.workspace }}/micropython/ports/rp2/modules/TS/sdcard.py
          cp src/TS/extcmd.py        ${{ github.workspace }}/micropython/ports/rp2/modules/TS/extcmd.py
          cp src/TS/printer.py       ${{ github.workspace }}/micropython/ports/rp2/modules/TS/printer.py
          cp src/TS/catalog.py       ${{ github.workspace }}/micropython/ports/rp2/modules/TS/catalog.py
          cp src/TS/native.py        ${{ github.workspace }}/micropython/ports/rp2/modules/TS/native.py
          cp src/TS/channels.py      ${{ github.workspace }}/micropython/ports/rp2/modules/TS/channels.py
          cp src/manifest.py         ${{ github.workspace }}/micropython/ports/rp2/boards/manifest.py

      - name: Build mpy-cross
        working-directory: ${{ github.workspace }}/micropython
        run: make -C mpy-cross

      - name: Fetch rp2 submodules
        working-directory: ${{ github.workspace }}/micropython/ports/rp2
        run: make submodules

      - name: Build rp2 firmware
        working-directory: ${{ github.workspace }}/micropython/ports/rp2
        run: |
          make clean
          make -j$(nproc)

      - name: Compile dev_tspico.mpy (if src/dev_tspico.py present)
        if: hashFiles('src/dev_tspico.py') != ''
        run: |
          MPYC="${{ github.workspace }}/micropython/mpy-cross/build/mpy-cross"
          "$MPYC" src/dev_tspico.py
          ls -la src/dev_tspico.mpy

      # The upgrade UF2 (src/upgrade/), as in build.yml: the web updater writes
      # it before the firmware for boards coming from 1.1 / 1.5, whose TS-2068
      # ROM can't talk to the current firmware. Published as upgrade.uf2.
      - name: Build the upgrade UF2
        run: |
          python3 tools/build-upgrade.py "$RUNNER_TEMP/upgrade"
          M=${{ github.workspace }}/micropython/ports/rp2
          mkdir -p $M/modules-upgrade/TS
          cp src/TS/__init__.py src/TS/tspico_io.py src/TS/sdcard.py src/TS/native.py $M/modules-upgrade/TS/
          cp src/upgrade/upgrade.py src/upgrade/main.py "$RUNNER_TEMP/upgrade/upgrade_data.py" $M/modules-upgrade/
          cp src/upgrade/manifest.py $M/boards/manifest_upgrade.py
          cd $M
          make -j$(nproc) BUILD=build-UPGRADE FROZEN_MANIFEST=$PWD/boards/manifest_upgrade.py
          cp build-UPGRADE/firmware.uf2 "$RUNNER_TEMP/upgrade.uf2"
          ls -la "$RUNNER_TEMP/upgrade.uf2"

      # Compile the tracked BASIC sources (basic/*.bas) into TAPs. They land
      # in "SD card/TAP/basic/" (gitignored) and get swept into the bundle by
      # the `cp -R "SD card/TAP/"` below. gcc/make come from build-essential.
      - name: Build BASIC programs (basic/ -> TAP)
        run: ./tools/build-basic.sh

      # ──────────────────────────────────────────────────────────────────
      # Assemble the release bundle. Structure mirrors the Pico-flash
      # layout so an end user can drag-drop `pico-flash/` contents
      # straight into the Pico's root via Thonny.
      # ──────────────────────────────────────────────────────────────────
      - name: Assemble release bundle
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          # Bundle layout (at the zip's root — no wrapping folder):
          #
          #   firmware.uf2          ← drop onto RPI-RP2 in BOOTSEL mode
          #   DEPLOY.md             ← end-user instructions
          #   src/                  ← goes on the Pico's internal flash
          #   │   ├── main.py
          #   │   ├── config.ini
          #   │   ├── words.txt
          #   │   ├── assets/*.tap
          #   │   └── rom/TSPICO.ROM      ← Z80 EXROM image (flash to chip)
          #   └── SD card/          ← goes on the user's SD card
          #       ├── TAP/                 (test TAPs, .dck/.rom etc.)
          #       └── help/                (tpi:help <topic> text)
          #
          # The deploy story: flash the UF2, copy the contents of src/ to
          # the Pico's flash root via Thonny (the ROM image gets flashed
          # to the TS-2068 EXROM chip separately), and copy the contents
          # of "SD card/" to the root of the SD card you'll plug into the
          # TS-Pico.
          STAGE="ts-pico-${TAG}"
          mkdir -p "${STAGE}/src/assets"
          mkdir -p "${STAGE}/src/rom"
          mkdir -p "${STAGE}/SD card/TAP"
          mkdir -p "${STAGE}/SD card/help"

          UF2_SRC="${{ github.workspace }}/micropython/ports/rp2/build-PICO/firmware.uf2"

          # Top-level firmware UF2.
          cp "${UF2_SRC}" "${STAGE}/firmware.uf2"

          # src/: Pico-side payload (flash filesystem + EXROM image).
          cp src/main.py       "${STAGE}/src/main.py"
          cp src/config.ini    "${STAGE}/src/config.ini"
          cp src/words.txt     "${STAGE}/src/words.txt"
          cp src/assets/*.tap  "${STAGE}/src/assets/"
          cp src/rom/TSPICO-21.ROM "${STAGE}/src/rom/"   # the slot-1 ROM only (flash/manifest.json)

          # SD card/: TAP files + help text the firmware reads from the
          # mounted SD card at runtime. Copy recursively so subfolders
          # (e.g. SD card/TAP/test/) come along, then pick up the loose
          # programs that build to the card's root (readme.tap).
          cp -R "SD card/TAP/"   "${STAGE}/SD card/TAP/"
          cp -R "SD card/help/"  "${STAGE}/SD card/help/"
          cp "SD card/"*.tap     "${STAGE}/SD card/"

          # Strip macOS metadata that may have ridden along.
          find "${STAGE}" -name ".DS_Store" -delete

          # Bundle deploy instructions.
          cat > "${STAGE}/DEPLOY.md" <<EOF
          # TS-Pico Firmware ${TAG}

          This bundle has three deploy targets:

          1. **Pico firmware** — \`firmware.uf2\` at the zip root.
          2. **Pico flash filesystem** — everything inside \`src/\`.
          3. **TS-2068 ROM** — \`src/rom/TSPICO-21.ROM\`, ROM 2.1 (flash
             slot 1).
          4. **SD card** — everything inside the \`SD card/\` folder.

          All four sides must match for the protocol to work end-to-end.

          ## 1. Flash the Pico firmware

          Hold **BOOTSEL** on the Pico, plug in USB, drag-drop
          \`firmware.uf2\` onto the \`RPI-RP2\` drive that appears.
          The Pico will reboot into MicroPython.

          ## 2. Copy src/ to the Pico's flash filesystem

          Connect via Thonny. Copy everything *inside* \`src/\` to the
          Pico's flash root, preserving the directory structure:

          | Bundle path | Goes to Pico path |
          |---|---|
          | \`src/main.py\`       | \`/main.py\`       |
          | \`src/config.ini\`    | \`/config.ini\`    |
          | \`src/words.txt\`     | \`/words.txt\`     |
          | \`src/assets/*.tap\`  | \`/assets/*.tap\`  |

          (\`src/rom/\` does NOT go on the Pico — see step 3.)

          ## 3. Install the TS-2068 ROM

          The web updater installs it for you. By hand: copy
          \`src/rom/TSPICO-21.ROM\` to the SD card's \`TAP\` folder,
          \`LOAD "tpi:TSPICO-21.ROM"\` then \`LOAD ""\`, and write it to
          Flash slot 1 while the 2068 runs from another slot; or program it
          into slot 1 of the flash chip (offset 0x8000) with a ROM
          programmer. The image is a raw 32K binary.

          ## 4. Copy "SD card/" to the SD card

          Mount the SD card you intend to use with the TS-Pico. Copy
          everything *inside* the \`SD card/\` folder to the card's root:

          | Bundle path | Goes to SD card path |
          |---|---|
          | \`SD card/TAP/\`     | \`/TAP/\`     |
          | \`SD card/help/\`    | \`/help/\`    |
          | \`SD card/readme.tap\` | \`/readme.tap\` |

          ## Verify

          Reboot the Pico. You should see:
          \`\`\`
          270000000
          INFO: SD Card initialized and mounted OK
          \`\`\`

          See README.md in the repo for the full picture:
          https://github.com/timex-sinclair-projects/tspico-firmware-build
          EOF

          # Zip the bundle. The zip wraps a single ts-pico-${TAG}/
          # folder so users don't get a flat dump of files when they
          # unzip; the *contents* of that folder are what they deploy.
          ZIP="ts-pico-${TAG}.zip"
          zip -r "${ZIP}" "${STAGE}"
          ls -la "${ZIP}"
          echo ""
          echo "=== bundle tree ==="
          find "${STAGE}" -type f | sort
          echo ""
          echo "ZIP_NAME=${ZIP}" >> "$GITHUB_ENV"

      # ──────────────────────────────────────────────────────────────────
      # 512K flash image (Pico-<tag>.rom).
      #
      # tools/build-flash.py lays the slots we own -- the TS-Pico ZX
      # Spectrum ROM (slot 0) and the TS-2068 ROM (slot 1) -- into a full
      # flash image. The remaining slots are third-party images we do not
      # vendor in this repo (ZX Diagnostics, Rodolfo Guerra's TK90/95 ROM,
      # the DCK cartridges), so they are copied from a known-good base
      # image. Where that comes from, first match wins:
      #
      #   1. the FLASH_BASE_URL repo variable, if set (an override);
      #   2. the first asset of the DRAFT release tagged `flash-base` in
      #      this repo. A draft's assets aren't public, but this job's
      #      GITHUB_TOKEN can read them. Drafts can't be looked up by tag,
      #      so we list the releases and pick it out. Never publish it.
      #
      # With neither, the step is skipped and the release simply carries
      # no flash image -- it never publishes a partial one. See
      # flash/README.md.
      # ──────────────────────────────────────────────────────────────────
      - name: Build 512K flash image
        id: flash
        env:
          FLASH_BASE_URL: ${{ vars.FLASH_BASE_URL }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          python3 tools/build-flash.py check flash/manifest.json
          if [ -n "${FLASH_BASE_URL}" ]; then
            echo "Base image: FLASH_BASE_URL"
            curl -fsSL "${FLASH_BASE_URL}" -o base.rom
          else
            ID="$(gh api "repos/${GITHUB_REPOSITORY}/releases" --paginate \
                    --jq '.[] | select(.draft and .tag_name=="flash-base") | .assets[0].id' \
                  | head -n1)" || ID=""
            if [ -z "${ID}" ] || [ "${ID}" = "null" ]; then
              echo "::warning::No FLASH_BASE_URL and no flash-base draft release - skipping the 512K flash image."
              exit 0
            fi
            echo "Base image: flash-base draft release, asset ${ID}"
            gh api -H "Accept: application/octet-stream" \
                "repos/${GITHUB_REPOSITORY}/releases/assets/${ID}" > base.rom
          fi
          OUT="Pico-${TAG}.rom"
          python3 tools/build-flash.py build flash/manifest.json \
                  --base base.rom --out "${OUT}"
          python3 tools/build-flash.py verify flash/manifest.json "${OUT}"
          echo "rom=${OUT}" >> "$GITHUB_OUTPUT"

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
          UF2: ${{ github.workspace }}/micropython/ports/rp2/build-PICO/firmware.uf2
          FLASH_ROM: ${{ steps.flash.outputs.rom }}
        run: |
          # Assets: bundle + raw UF2 + the upgrade UF2, plus the 512K flash
          # image when the build-flash step produced one (see the step above).
          # pages.yml publishes firmware.uf2 and upgrade.uf2 to the updater.
          ASSETS=( "${ZIP_NAME}" "${UF2}#firmware.uf2 (raw, for in-place reflash)"
                   "${RUNNER_TEMP}/upgrade.uf2#upgrade.uf2 (ROM updater for boards coming from 1.1)" )
          if [ -n "${FLASH_ROM:-}" ] && [ -f "${FLASH_ROM}" ]; then
            ASSETS+=( "${FLASH_ROM}#${FLASH_ROM} (512K flash image, for a chip programmer)" )
          fi
          # Idempotent: a maintainer may pre-create the release (e.g. to
          # write custom notes), which pushes the tag and triggers this
          # workflow. In that case `gh release create` would fail with
          # "a release with the same tag name already exists". So:
          #   - release exists  → upload assets to it (--clobber replaces
          #     any same-named assets), leaving the existing title/notes
          #     untouched.
          #   - release absent  → create it fresh with the workflow's standard
          #     title, and the notes in .github/release-notes/<tag>.md if that
          #     file exists at the tag (auto-generated notes otherwise).
          #     Prefer the file: creating the release is what fires pages.yml,
          #     so pre-creating it by hand for custom notes would publish the
          #     updater payload before these assets are attached.
          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists — uploading assets to it."
            gh release upload "${TAG}" "${ASSETS[@]}" --clobber
          else
            NOTES_FILE=".github/release-notes/${TAG}.md"
            if [ -f "${NOTES_FILE}" ]; then
              echo "Release ${TAG} does not exist — creating it with ${NOTES_FILE}."
              NOTES=( --notes-file "${NOTES_FILE}" )
            else
              echo "Release ${TAG} does not exist — creating it with generated notes."
              NOTES=( --generate-notes )
            fi
            gh release create "${TAG}" "${ASSETS[@]}" \
              --title "TS-Pico Firmware ${TAG}" \
              "${NOTES[@]}"
          fi

      # ──────────────────────────────────────────────────────────────────
      # Publishing the website + Web Updater to GitHub Pages is handled by a
      # separate workflow, .github/workflows/pages.yml. Creating the Release
      # above fires a `release: published` event, which triggers pages.yml; it
      # rebuilds the Jekyll site and mounts the updater at /updater/ with THIS
      # release's firmware.uf2 (downloaded from the release assets). That keeps
      # the payload same-origin — GitHub's release-asset CDN
      # (objects.githubusercontent.com) sends no Access-Control-Allow-Origin
      # header, so a browser on the Pages site can't fetch release assets
      # directly; serving them from /updater/ sidesteps CORS. See
      # web-updater/README.md and pages.yml.
      # ──────────────────────────────────────────────────────────────────
