name: Release TS-Pico Firmware

# Fires on a git tag matching v*. To cut a release:
#
#   git tag v1.0.0
#   git push --tags
#
# The workflow builds firmware.uf2 + dev_tspico.mpy fresh from the
# tagged commit, bundles them with all the Pico-flash content from
# the repo (main.py, config.ini, assets/, help/, words.txt, plus the
# dev override convenience files), zips the bundle, and creates a
# GitHub Release with auto-generated notes (from commit messages
# since the previous tag).
#
# Manual dispatch is also supported for testing: run the workflow
# from the Actions tab with workflow_dispatch and supply a tag.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v1.0.0). Must already exist.'
        required: true
        type: string

jobs:
  release:
    runs-on: ubuntu-22.04

    permissions:
      # Required so `gh release create` can publish the release and
      # upload assets. Default GITHUB_TOKEN only has read perms.
      contents: write

    steps:
      - name: Determine tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Releasing tag: ${TAG}"

      - name: Checkout repo at tag
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.tag }}
          fetch-depth: 0  # full history for release-notes generation

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git build-essential cmake \
            gcc-arm-none-eabi libnewlib-arm-none-eabi \
            python3 zip

      - name: Clone MicroPython v1.20.0
        run: |
          git clone --depth 1 --branch v1.20.0 \
            https://github.com/micropython/micropython.git ${{ github.workspace }}/micropython

      # ──────────────────────────────────────────────────────────────────
      # The next four steps mirror .github/workflows/build.yml. If you
      # change either workflow, update both. (Extracting to a composite
      # action is the cleaner option but adds an indirection we don't
      # need yet — two callers.)
      # ──────────────────────────────────────────────────────────────────
      - name: Stage frozen modules
        run: |
          mkdir -p ${{ github.workspace }}/micropython/ports/rp2/modules/TS
          cp TS/__init__.py      ${{ github.workspace }}/micropython/ports/rp2/modules/TS/__init__.py
          cp TS/tspico.py        ${{ github.workspace }}/micropython/ports/rp2/modules/TS/tspico.py
          cp TS/tspico_io.py     ${{ github.workspace }}/micropython/ports/rp2/modules/TS/tspico_io.py
          cp TS/sdcard.py        ${{ github.workspace }}/micropython/ports/rp2/modules/TS/sdcard.py
          cp TS/extcmd.py        ${{ github.workspace }}/micropython/ports/rp2/modules/TS/extcmd.py
          cp TS/help.py          ${{ github.workspace }}/micropython/ports/rp2/modules/TS/help.py
          cp manifest.py         ${{ github.workspace }}/micropython/ports/rp2/boards/manifest.py

      - name: Build mpy-cross
        working-directory: ${{ github.workspace }}/micropython
        run: make -C mpy-cross

      - name: Fetch rp2 submodules
        working-directory: ${{ github.workspace }}/micropython/ports/rp2
        run: make submodules

      - name: Build rp2 firmware
        working-directory: ${{ github.workspace }}/micropython/ports/rp2
        run: |
          make clean
          make -j$(nproc)

      - name: Compile dev_tspico.mpy (if dev_tspico.py present)
        if: hashFiles('dev_tspico.py') != ''
        run: |
          MPYC="${{ github.workspace }}/micropython/mpy-cross/build/mpy-cross"
          "$MPYC" dev_tspico.py
          ls -la dev_tspico.mpy

      # ──────────────────────────────────────────────────────────────────
      # Assemble the release bundle. Structure mirrors the Pico-flash
      # layout so an end user can drag-drop `pico-flash/` contents
      # straight into the Pico's root via Thonny.
      # ──────────────────────────────────────────────────────────────────
      - name: Assemble release bundle
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          # Bundle layout (per maintainer request):
          #
          #   ts-pico/
          #   ├── DEPLOY.md
          #   ├── main.py             ← top-level: the boot script
          #   ├── config.ini          ← top-level: runtime config
          #   ├── assets/             ← top-level: internal protocol .tap files
          #   │   └── *.tap
          #   └── pico/               ← complete drop-in for Pico flash
          #       ├── firmware.uf2
          #       ├── main.py
          #       ├── config.ini
          #       ├── words.txt
          #       ├── assets/*.tap
          #       └── help/*.txt
          #
          # The top-level `main.py`, `config.ini`, and `assets/` are the
          # canonical sources; `pico/` aggregates everything that needs
          # to be on the Pico's flash filesystem (UF2 + flash content)
          # for a single drag-drop deploy.
          STAGE="ts-pico"
          mkdir -p "${STAGE}/assets"
          mkdir -p "${STAGE}/pico/assets"
          mkdir -p "${STAGE}/pico/help"

          UF2_SRC="${{ github.workspace }}/micropython/ports/rp2/build-PICO/firmware.uf2"

          # Top-level: the boot/config/assets the user cares about directly.
          cp main.py     "${STAGE}/main.py"
          cp config.ini  "${STAGE}/config.ini"
          cp assets/*.tap "${STAGE}/assets/"

          # pico/: complete Pico-flash payload (UF2 + everything that
          # lives on the Pico's filesystem).
          cp "${UF2_SRC}" "${STAGE}/pico/firmware.uf2"
          cp main.py      "${STAGE}/pico/main.py"
          cp config.ini   "${STAGE}/pico/config.ini"
          cp words.txt    "${STAGE}/pico/words.txt"
          cp assets/*.tap "${STAGE}/pico/assets/"
          cp help/*.txt   "${STAGE}/pico/help/"

          # Bundle deploy instructions.
          cat > "${STAGE}/DEPLOY.md" <<EOF
          # TS-Pico Firmware ${TAG}

          ## Quick deploy

          1. **Flash the firmware**: hold BOOTSEL on the Pico, plug in USB,
             drag-drop \`pico/firmware.uf2\` onto the \`RPI-RP2\` drive
             that appears. The Pico will reboot into MicroPython.

          2. **Connect via Thonny** and confirm you're at a bare REPL.

          3. **Copy everything *inside* \`pico/\` (except \`firmware.uf2\`)
             to the Pico's flash root** via Thonny's file pane. Preserve
             the directory structure:

             | Bundle path | Goes to Pico path |
             |---|---|
             | \`pico/main.py\`       | \`/main.py\`       |
             | \`pico/config.ini\`    | \`/config.ini\`    |
             | \`pico/words.txt\`     | \`/words.txt\`     |
             | \`pico/assets/*.tap\`  | \`/assets/*.tap\`  |
             | \`pico/help/*.txt\`    | \`/help/*.txt\`    |

          4. **Reboot the Pico**. You should see the boot banner:
             \`\`\`
             270000000
             INFO: SD Card initialized and mounted OK
             \`\`\`

          ## What's in this bundle

          - \`main.py\`, \`config.ini\`, \`assets/\` at the top level —
            the canonical user-facing files (edit \`config.ini\` here,
            copy back into \`pico/\` if you change anything before
            deploying).
          - \`pico/\` — the complete Pico-flash payload: the firmware UF2
            plus every file that needs to live on the Pico's internal
            filesystem.

          See README.md in the repo for the full picture:
          https://github.com/timex-sinclair-projects/tspico-firmware-build
          EOF

          # Zip the bundle. Filename carries the tag; the folder inside
          # is just `ts-pico/` so paths in DEPLOY.md stay version-free.
          ZIP="ts-pico-${TAG}.zip"
          zip -r "${ZIP}" "${STAGE}"
          ls -la "${ZIP}"
          echo ""
          echo "=== bundle tree ==="
          find "${STAGE}" -type f | sort
          echo ""
          echo "ZIP_NAME=${ZIP}" >> "$GITHUB_ENV"

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
          UF2: ${{ github.workspace }}/micropython/ports/rp2/build-PICO/firmware.uf2
        run: |
          # Idempotent: a maintainer may pre-create the release (e.g. to
          # write custom notes), which pushes the tag and triggers this
          # workflow. In that case `gh release create` would fail with
          # "a release with the same tag name already exists". So:
          #   - release exists  → upload assets to it (--clobber replaces
          #     any same-named assets), leaving the existing title/notes
          #     untouched.
          #   - release absent  → create it fresh with auto-generated
          #     notes and the workflow's standard title.
          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists — uploading assets to it."
            gh release upload "${TAG}" \
              "${ZIP_NAME}" \
              "${UF2}#firmware.uf2 (raw, for in-place reflash)" \
              --clobber
          else
            echo "Release ${TAG} does not exist — creating it."
            gh release create "${TAG}" \
              "${ZIP_NAME}" \
              "${UF2}#firmware.uf2 (raw, for in-place reflash)" \
              --title "TS-Pico Firmware ${TAG}" \
              --generate-notes
          fi
