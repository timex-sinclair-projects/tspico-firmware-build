name: Build TS-Pico Firmware

on:
  push:
    # Build a UF2 for every pushed branch, not just main. This lets
  # contributors test changes on real hardware by flashing the UF2
    # from their feature branch before opening a PR. See CLAUDE.md
    # "GitHub workflow" for the rules around branch-based testing.
    branches: ['**']
  pull_request:
    # Also build on PR open/update so the UF2 is rebuilt against the
    # merge result — catches conflicts that pass on the branch but
    # break when combined with main.
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git build-essential cmake \
            gcc-arm-none-eabi libnewlib-arm-none-eabi \
            python3

      # Smoke-test the BASIC -> TAP toolchain on every push/PR. The .tap
      # outputs aren't committed (they're gitignored; see basic/README.md),
      # so this is the build that catches a .bas that won't tokenize. gcc/make
      # come from build-essential installed above.
      - name: Build BASIC programs (basic/ -> TAP)
        run: ./tools/build-basic.sh 2>&1 | tee "$RUNNER_TEMP/basic-build.log"

      # Publish the generated .tap files so a branch build is testable without
      # a local toolchain. They are gitignored by design, so before this step
      # the only way to get one was to clone and run build-basic.sh yourself --
      # which meant a UF2 could be tested from CI but the BASIC programs that
      # exercise it could not.
      #
      # The destination paths come from build-basic.sh's own "==> src -> dst"
      # output rather than a glob, because "SD card/" also holds COMMITTED
      # .tap files and a glob would sweep those up too. Trailing " (N programs)"
      # marks a multi-program tape and is not part of the path. `IFS= read -r`
      # keeps the space in "SD card" intact.
      - name: Stage generated .tap files
        run: |
          set -euo pipefail
          mkdir -p basic-taps
          sed -n 's/^==> basic\/.* -> //p' "$RUNNER_TEMP/basic-build.log" \
            | sed 's/ ([0-9]* programs)$//' \
            | while IFS= read -r dst; do
                if [ ! -f "$dst" ]; then
                  echo "::error::build-basic.sh reported '$dst' but it does not exist"
                  exit 1
                fi
                mkdir -p "basic-taps/$(dirname "$dst")"
                cp "$dst" "basic-taps/$dst"
              done
          echo "staged:"
          find basic-taps -type f -print0 | xargs -0 ls -l

      - name: Upload generated .tap artifact
        uses: actions/upload-artifact@v4
        with:
          name: basic-taps
          path: basic-taps/
          retention-days: 30

      # Host-side tests. These mock machine/rp2 and run the REAL firmware
      # modules on CPython, so they catch control-flow regressions without
      # a Pico attached. They are NOT a substitute for hardware testing —
      # nothing here observes the Z80 bus (see src/CLAUDE.md) — but they
      # do pin invariants that used to be verifiable only by flashing a
      # UF2 and typing commands on a 2068. Added with the issue-#42 fix,
      # whose regression test is process_cmd_hosttest.py.
      - name: Run host-side tests
        run: |
          python3 src/test/save_harness_hosttest.py
          python3 src/test/process_cmd_hosttest.py
          python3 src/test/rom_sync_hosttest.py
          python3 src/test/abort_harness_hosttest.py
          python3 src/test/sync_io_hosttest.py
          python3 src/test/build_flash_hosttest.py
          python3 src/test/sdcard_init_hosttest.py
          python3 src/test/load_ts_hosttest.py
          python3 src/test/save_ts_hosttest.py
          python3 src/test/cmd_io_hosttest.py
          python3 src/test/printer_hosttest.py
          python3 src/test/printer_io_hosttest.py
          python3 src/test/sd_mount_hosttest.py
          python3 src/test/dir_files_eio_hosttest.py
          python3 src/test/catalog_hosttest.py
          python3 src/test/disk_cmds_hosttest.py
          python3 src/test/sd_wedged_hosttest.py
          python3 src/test/sd_recover_hosttest.py
          python3 src/test/save_name_hosttest.py
          python3 src/test/zx48_hosttest.py
          python3 src/test/zx48_io_hosttest.py
          python3 src/test/zx48_tpi_hosttest.py
          python3 src/test/rom_zx48_hosttest.py
          python3 src/test/updater_hosttest.py
          python3 src/test/upgrade_hosttest.py
          python3 src/test/stdin_drain_hosttest.py
      # Fails the build if a ROM in flash/manifest.json changed without its
      # crc32 being updated -- i.e. nobody would notice that the next 512K
      # image ships a different ROM than the manifest claims.
      - name: Check the flash manifest against the ROMs in the repo
        run: python3 tools/build-flash.py check flash/manifest.json

      - name: Clone MicroPython v1.20.0
        run: |
          git clone --depth 1 --branch v1.20.0 \
            https://github.com/micropython/micropython.git ${{ github.workspace }}/micropython

      - name: Stage frozen modules
        run: |
          # NOTE: main.py is NOT frozen — it must live on the Pico's flash
          # filesystem. This way you can disconnect it (or hit Ctrl-C in Thonny)
          # to stop auto-execution for debugging.
          #
          # tspico.py uses `from TS.sdcard import *` and `from TS.tspico_io import ...`
          # so we keep the TS/ package layout when freezing.
          mkdir -p ${{ github.workspace }}/micropython/ports/rp2/modules/TS
          cp src/TS/__init__.py      ${{ github.workspace }}/micropython/ports/rp2/modules/TS/__init__.py
          cp src/TS/tspico.py        ${{ github.workspace }}/micropython/ports/rp2/modules/TS/tspico.py
          cp src/TS/tspico_io.py     ${{ github.workspace }}/micropython/ports/rp2/modules/TS/tspico_io.py
          cp src/TS/sdcard.py        ${{ github.workspace }}/micropython/ports/rp2/modules/TS/sdcard.py
          cp src/TS/extcmd.py        ${{ github.workspace }}/micropython/ports/rp2/modules/TS/extcmd.py
          cp src/TS/help.py          ${{ github.workspace }}/micropython/ports/rp2/modules/TS/help.py
          cp src/TS/printer.py       ${{ github.workspace }}/micropython/ports/rp2/modules/TS/printer.py
          cp src/TS/catalog.py       ${{ github.workspace }}/micropython/ports/rp2/modules/TS/catalog.py

          # Install our custom frozen-modules manifest in place of the
          # default rp2 manifest. Our manifest explicitly freezes the
          # TS/ package so `import TS.tspico` works at runtime.
          cp src/manifest.py ${{ github.workspace }}/micropython/ports/rp2/boards/manifest.py

          echo "=== modules/ contents ==="
          ls -la ${{ github.workspace }}/micropython/ports/rp2/modules/
          ls -la ${{ github.workspace }}/micropython/ports/rp2/modules/TS/
          echo "=== manifest.py contents ==="
          cat ${{ github.workspace }}/micropython/ports/rp2/boards/manifest.py

      - name: Build mpy-cross
        working-directory: ${{ github.workspace }}/micropython
        run: make -C mpy-cross

      - name: Fetch rp2 submodules
        working-directory: ${{ github.workspace }}/micropython/ports/rp2
        run: make submodules

      - name: Build rp2 firmware
        working-directory: ${{ github.workspace }}/micropython/ports/rp2
        run: |
          make clean
          make -j$(nproc)

      - name: Show build output
        working-directory: ${{ github.workspace }}/micropython/ports/rp2
        run: |
          echo "=== build-PICO directory ==="
          ls -la build-PICO/ 2>/dev/null || echo "(no build-PICO dir)"
          echo ""
          echo "=== firmware.uf2 location(s) ==="
          find . -name "firmware.uf2" -ls 2>/dev/null
          echo ""
          echo "=== all .uf2 files ==="
          find . -name "*.uf2" -ls 2>/dev/null

      - name: Upload firmware.uf2 artifact
        uses: actions/upload-artifact@v4
        with:
          name: tspico-firmware-uf2
          path: ${{ github.workspace }}/micropython/ports/rp2/build-PICO/firmware.uf2
          retention-days: 30

      # The upgrade UF2: a separate firmware the web updater writes first, for
      # boards coming from 1.1 / 1.5. It serves src/upgrade/updater.asm's tape
      # to the original Spectrum ROM and feeds it the ROMs for flash slots 1
      # and 0 (from flash/manifest.json). See src/upgrade/upgrade.py.
      - name: Build the upgrade payload (updater tape + ROM images)
        run: python3 tools/build-upgrade.py "$RUNNER_TEMP/upgrade"

      - name: Stage the upgrade UF2's frozen modules
        run: |
          M=${{ github.workspace }}/micropython/ports/rp2
          mkdir -p $M/modules-upgrade/TS
          cp src/TS/__init__.py src/TS/tspico_io.py src/TS/sdcard.py $M/modules-upgrade/TS/
          cp src/upgrade/upgrade.py src/upgrade/main.py "$RUNNER_TEMP/upgrade/upgrade_data.py" $M/modules-upgrade/
          cp src/upgrade/manifest.py $M/boards/manifest_upgrade.py
          ls -la $M/modules-upgrade $M/modules-upgrade/TS

      - name: Build the upgrade UF2
        working-directory: ${{ github.workspace }}/micropython/ports/rp2
        run: make -j$(nproc) BUILD=build-UPGRADE FROZEN_MANIFEST=$PWD/boards/manifest_upgrade.py

      - name: Upload the upgrade UF2 artifact
        uses: actions/upload-artifact@v4
        with:
          name: tspico-upgrade-uf2
          path: |
            ${{ github.workspace }}/micropython/ports/rp2/build-UPGRADE/firmware.uf2
            ${{ runner.temp }}/upgrade/updater.tap
          retention-days: 30

      # The web updater's WebUSB flash path, against a fake PICOBOOT device,
      # with the two UF2s just built: every block lands where the UF2 says,
      # and the read-back verify catches a write that didn't take.
      - name: Test the web updater's flasher with the built UF2s
        run: |
          node web-updater/test/flasher.test.mjs \
            ${{ github.workspace }}/micropython/ports/rp2/build-PICO/firmware.uf2 \
            ${{ github.workspace }}/micropython/ports/rp2/build-UPGRADE/firmware.uf2

      # The Pico's MicroPython parser is RAM-hungry. Once dev_tspico.py
      # grew past ~4500 lines (post stage-9 telemetry additions), parsing
      # it at boot started to OOM. Pre-compiled .mpy bytecode skips the
      # parser entirely and is ~80% smaller besides. We re-use the
      # mpy-cross binary built earlier in this job (line ~65) so the
      # bytecode version matches the UF2's MicroPython exactly.
      #
      # Step is conditional: only branches with dev_tspico.py present
      # produce the artifact. On main (which uses the frozen TS.tspico
      # via the manifest) the file is absent and this step is skipped.
      - name: Compile dev_tspico.mpy (if src/dev_tspico.py present)
        if: hashFiles('src/dev_tspico.py') != ''
        run: |
          MPYC="${{ github.workspace }}/micropython/mpy-cross/build/mpy-cross"
          "$MPYC" --version
          "$MPYC" src/dev_tspico.py
          ls -la src/dev_tspico.mpy
          echo ""
          echo "size comparison:"
          du -h src/dev_tspico.py src/dev_tspico.mpy

      - name: Upload dev_tspico.mpy artifact
        if: hashFiles('src/dev_tspico.py') != ''
        uses: actions/upload-artifact@v4
        with:
          name: dev_tspico-mpy
          path: src/dev_tspico.mpy
          retention-days: 30

      - name: Upload build logs (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            ${{ github.workspace }}/micropython/ports/rp2/build-PICO/CMakeFiles/CMakeOutput.log
            ${{ github.workspace }}/micropython/ports/rp2/build-PICO/CMakeFiles/CMakeError.log
          retention-days: 7
