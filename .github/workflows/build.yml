name: Build TS-Pico Firmware

on:
  push:
    # Build a UF2 for every pushed branch, not just main. This lets
  # contributors test changes on real hardware by flashing the UF2
    # from their feature branch before opening a PR. See CLAUDE.md
    # "GitHub workflow" for the rules around branch-based testing.
    branches: ['**']
  pull_request:
    # Also build on PR open/update so the UF2 is rebuilt against the
    # merge result — catches conflicts that pass on the branch but
    # break when combined with main.
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git build-essential cmake \
            gcc-arm-none-eabi libnewlib-arm-none-eabi \
            python3

      # Smoke-test the BASIC -> TAP toolchain on every push/PR. The .tap
      # outputs aren't committed (generated under "SD card/TAP/basic/"), so
      # this is the build that catches a .bas that won't tokenize. gcc/make
      # come from build-essential installed above.
      - name: Build BASIC programs (basic/ -> TAP)
        run: ./tools/build-basic.sh

      - name: Clone MicroPython v1.20.0
        run: |
          git clone --depth 1 --branch v1.20.0 \
            https://github.com/micropython/micropython.git ${{ github.workspace }}/micropython

      - name: Stage frozen modules
        run: |
          # NOTE: main.py is NOT frozen — it must live on the Pico's flash
          # filesystem. This way you can disconnect it (or hit Ctrl-C in Thonny)
          # to stop auto-execution for debugging.
          #
          # tspico.py uses `from TS.sdcard import *` and `from TS.tspico_io import ...`
          # so we keep the TS/ package layout when freezing.
          mkdir -p ${{ github.workspace }}/micropython/ports/rp2/modules/TS
          cp src/TS/__init__.py      ${{ github.workspace }}/micropython/ports/rp2/modules/TS/__init__.py
          cp src/TS/tspico.py        ${{ github.workspace }}/micropython/ports/rp2/modules/TS/tspico.py
          cp src/TS/tspico_io.py     ${{ github.workspace }}/micropython/ports/rp2/modules/TS/tspico_io.py
          cp src/TS/sdcard.py        ${{ github.workspace }}/micropython/ports/rp2/modules/TS/sdcard.py
          cp src/TS/extcmd.py        ${{ github.workspace }}/micropython/ports/rp2/modules/TS/extcmd.py
          cp src/TS/help.py          ${{ github.workspace }}/micropython/ports/rp2/modules/TS/help.py

          # Install our custom frozen-modules manifest in place of the
          # default rp2 manifest. Our manifest explicitly freezes the
          # TS/ package so `import TS.tspico` works at runtime.
          cp src/manifest.py ${{ github.workspace }}/micropython/ports/rp2/boards/manifest.py

          echo "=== modules/ contents ==="
          ls -la ${{ github.workspace }}/micropython/ports/rp2/modules/
          ls -la ${{ github.workspace }}/micropython/ports/rp2/modules/TS/
          echo "=== manifest.py contents ==="
          cat ${{ github.workspace }}/micropython/ports/rp2/boards/manifest.py

      - name: Build mpy-cross
        working-directory: ${{ github.workspace }}/micropython
        run: make -C mpy-cross

      - name: Fetch rp2 submodules
        working-directory: ${{ github.workspace }}/micropython/ports/rp2
        run: make submodules

      - name: Build rp2 firmware
        working-directory: ${{ github.workspace }}/micropython/ports/rp2
        run: |
          make clean
          make -j$(nproc)

      - name: Show build output
        working-directory: ${{ github.workspace }}/micropython/ports/rp2
        run: |
          echo "=== build-PICO directory ==="
          ls -la build-PICO/ 2>/dev/null || echo "(no build-PICO dir)"
          echo ""
          echo "=== firmware.uf2 location(s) ==="
          find . -name "firmware.uf2" -ls 2>/dev/null
          echo ""
          echo "=== all .uf2 files ==="
          find . -name "*.uf2" -ls 2>/dev/null

      - name: Upload firmware.uf2 artifact
        uses: actions/upload-artifact@v4
        with:
          name: tspico-firmware-uf2
          path: ${{ github.workspace }}/micropython/ports/rp2/build-PICO/firmware.uf2
          retention-days: 30

      # The Pico's MicroPython parser is RAM-hungry. Once dev_tspico.py
      # grew past ~4500 lines (post stage-9 telemetry additions), parsing
      # it at boot started to OOM. Pre-compiled .mpy bytecode skips the
      # parser entirely and is ~80% smaller besides. We re-use the
      # mpy-cross binary built earlier in this job (line ~65) so the
      # bytecode version matches the UF2's MicroPython exactly.
      #
      # Step is conditional: only branches with dev_tspico.py present
      # produce the artifact. On main (which uses the frozen TS.tspico
      # via the manifest) the file is absent and this step is skipped.
      - name: Compile dev_tspico.mpy (if src/dev_tspico.py present)
        if: hashFiles('src/dev_tspico.py') != ''
        run: |
          MPYC="${{ github.workspace }}/micropython/mpy-cross/build/mpy-cross"
          "$MPYC" --version
          "$MPYC" src/dev_tspico.py
          ls -la src/dev_tspico.mpy
          echo ""
          echo "size comparison:"
          du -h src/dev_tspico.py src/dev_tspico.mpy

      - name: Upload dev_tspico.mpy artifact
        if: hashFiles('src/dev_tspico.py') != ''
        uses: actions/upload-artifact@v4
        with:
          name: dev_tspico-mpy
          path: src/dev_tspico.mpy
          retention-days: 30

      - name: Upload build logs (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            ${{ github.workspace }}/micropython/ports/rp2/build-PICO/CMakeFiles/CMakeOutput.log
            ${{ github.workspace }}/micropython/ports/rp2/build-PICO/CMakeFiles/CMakeError.log
          retention-days: 7
