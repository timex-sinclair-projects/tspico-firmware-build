<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
{%- assign page_title = page.title | default: site.title -%}
<title>{% if page.title and page.title != site.title %}{{ page.title }} · {{ site.title }}{% else %}{{ site.title }} — {{ site.tagline }}{% endif %}</title>
<meta name="description" content="{{ page.description | default: site.description | strip_newlines }}">
<link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
<link rel="icon" href="{{ '/assets/img/ts-pico-cover.png' | relative_url }}">
